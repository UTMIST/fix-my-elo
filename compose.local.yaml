# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  api:
    container_name: api
    build:
      context: ./backend
    environment:
      - ENGINE_URL=http://engine_server:8001
      - FRONTEND_URL=http://frontend:3100
      - AGENT_MOVE_DEFAULT_NUM_SIM=${AGENT_MOVE_DEFAULT_NUM_SIM}
      - AGENT_MOVE_DEFAULT_TEMP=${AGENT_MOVE_DEFAULT_TEMP}
      - AGENT_MOVE_TIMEOUT_MS=${AGENT_MOVE_TIMEOUT_MS}
      - AGENT_MOVE_MIN_TIMEOUT_MS=${AGENT_MOVE_MIN_TIMEOUT_MS}
      - PORT=8100
    ports:
      - 8100:8100
  engine_server:
    container_name: engine_server
    build:
      context: ./backend
      dockerfile: engine_server.Dockerfile
    environment:
      - MODEL_PATH=${MODEL_PATH}
      - C_PUCT=${C_PUCT}
      - DIRICHLET_ALPHA=${DIRICHLET_ALPHA}
      - DIRICHLET_EPSILON=${DIRICHLET_EPSILON}
      - MCTS_BATCH_SIZE=${MCTS_BATCH_SIZE}
      - NUM_SIM_DEFAULT=${NUM_SIM_DEFAULT}
      - TEMP_DEFAULT=${TEMP_DEFAULT}
      - PORT=8001
    ports:
      - 8001:8001
  frontend:
    container_name: frontend
    build:
      context: ./fme-app
      args:
        # Browser-reachable URL. Inlined into the client bundle at build time,
        # so it cannot be a compose service name like http://api:8100.
        NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8100
    environment:
      NODE_ENV: production
      PORT: 3100
    ports:
      - 3100:3100

